<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブロックとコードの対応表｜ブロックAIアシスタント</title>
<style>
  body { margin: 0; background: #F3F4F7; color: #1F2328; font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  header { background: #7C4FD0; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 18px; flex: 1; }
  header button { border: none; background: #fff; color: #4B23A3; font: inherit; font-weight: 700; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  main { max-width: 1000px; margin: 0 auto; padding: 18px 20px 40px; }
  .lead { margin: 0 0 14px; color: #374151; }
  .grp { background: #fff; border: 1px solid #DDE1E8; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; break-inside: avoid; }
  .grp h2 { margin: 0 0 10px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .grp h2 i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .item { padding: 8px 0; border-top: 1px solid #EEF0F3; break-inside: avoid; }
  .item:first-of-type { border-top: none; }
  .note { font-size: 13px; color: #555B63; margin: 2px 0 0 36px; }
  @media print {
    header button { display: none; }
    body { background: #fff; }
    header { background: #fff; color: #000; border-bottom: 2px solid #7C4FD0; }
    .grp { border-color: #ccc; }
    .bv-row:hover { background: transparent !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<header><h1>ブロックとコードの対応表</h1><button type="button" onclick="window.print()">印刷する</button></header>
<main>
  <p class="lead">左が Scratch のブロック、右が Python のコード。同じ行どうしが同じ命令です。ブロックの白いまる（入れる値）は、コードの ( ) の中に入ります。</p>
  <div id="list"></div>
</main>
<script src="/app/blockview.js"></script>
<script>
(function () {
  const B = window.BlockView;
  const st = document.createElement('style');
  st.textContent = B.CSS;
  document.head.appendChild(st);
  const list = document.getElementById('list');
  B.REFERENCE.forEach((g) => {
    const box = document.createElement('section');
    box.className = 'grp';
    box.innerHTML = '<h2><i style="background:' + B.CAT[g.cat].c + '"></i></h2>';
    box.querySelector('h2').appendChild(document.createTextNode(g.title));
    g.items.forEach((it) => {
      const d = document.createElement('div');
      d.className = 'item';
      d.innerHTML = B.table(it.code, { noHead: true }) + '<div class="note"></div>';
      d.querySelector('.note').textContent = it.note;
      box.appendChild(d);
    });
    list.appendChild(box);
  });
})();
</script>
</body>
</html>
