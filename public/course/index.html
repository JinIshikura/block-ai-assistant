<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教材の確認｜ブロックAIアシスタント</title>
<style>
  body { margin: 0; background: #F3F4F7; color: #1F2328; font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  header { background: #7C4FD0; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 2; }
  header h1 { margin: 0; font-size: 18px; flex: 1; }
  header select { font: inherit; border-radius: 8px; border: none; padding: 6px 10px; max-width: 50vw; }
  main { max-width: 1000px; margin: 0 auto; padding: 18px 20px 60px; display: flex; flex-direction: column; gap: 16px; }
  .slide { background: #fff; border: 1px solid #DDE1E8; border-radius: 12px; padding: 18px 22px; }
  .slide .meta { font-size: 12px; color: #6B7280; }
  .slide h2 { margin: 4px 0 8px; font-size: 21px; }
  .slide p { margin: 0 0 8px; color: #374151; }
  pre.plain { font-family: "BIZ UDGothic", Consolas, Menlo, monospace; background: #1E1F23; color: #E6E6E6; border-radius: 8px; padding: 10px 14px; overflow: auto; }
  .exl { background: #fff; border: 1px solid #DDE1E8; border-radius: 12px; padding: 14px 20px; }
  .exl h3 { margin: 0 0 6px; font-size: 16px; }
  .exl ol { margin: 0; padding-left: 20px; }
  .exl .g { font-size: 13px; color: #555B63; }
</style>
</head>
<body>
<header><h1>教材の確認（スライドと演習の一覧）</h1><select id="pick"></select></header>
<main id="box"></main>
<script src="/app/blockview.js"></script>
<script>
(async function () {
  const B = window.BlockView;
  const st = document.createElement('style');
  st.textContent = B.CSS + '.bv-cd{font-size:15px}.slide .bv-words{margin:6px 0 10px}';
  document.head.appendChild(st);
  const course = await fetch('/learn/course.json', { cache: 'no-cache' }).then((r) => r.json());
  const pick = document.getElementById('pick');
  const lessons = [];
  course.steps.forEach((s) => s.lessons.forEach((l) => { lessons.push({ step: s.title, l }); const o = document.createElement('option'); o.value = lessons.length - 1; o.textContent = s.title.replace('　', ' ') + '｜' + l.title; pick.appendChild(o); }));
  const wordFirst = {};
  course.steps.forEach((st) => st.lessons.forEach((l) => l.slides.forEach((sl, k) => { if (sl.code) B.wordsIn(sl.code).forEach((w) => { if (!wordFirst[w.name]) wordFirst[w.name] = l.id + ':' + k; }); })));
  const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  function show(i) {
    const { step, l } = lessons[i];
    const box = document.getElementById('box');
    box.innerHTML = '';
    l.slides.forEach((s, k) => {
      const d = document.createElement('section');
      d.className = 'slide';
      d.innerHTML = '<div class="meta">' + esc(step) + '　' + esc(l.title) + '　スライド ' + (k + 1) + ' / ' + l.slides.length + '</div><h2>' + esc(s.title) + '</h2>' +
        String(s.text || '').split('\n').map((t) => '<p>' + esc(t) + '</p>').join('') +
        B.wordsBox(s.code ? B.wordsIn(s.code).filter((w) => wordFirst[w.name] === l.id + ':' + k) : [], '新しく出てきた英語の意味') +
        (s.code ? (s.plain ? '<pre class="plain">' + esc(s.code) + '</pre>' : B.table(s.code)) : '');
      box.appendChild(d);
    });
    l.exercises.forEach((e, k) => {
      const d = document.createElement('section');
      d.className = 'exl';
      if (e.type === 'quiz') {
        d.innerHTML = '<h3>演習' + (k + 1) + '（えらぶ問題）　' + esc(e.title) + '</h3><p class="g">' + esc(e.question) + '</p>' + (e.code ? B.table(e.code) : '') +
          '<ol style="margin:8px 0 0">' + e.choices.map((c, i) => '<li style="margin:4px 0">' + (c.block ? B.blocks(c.block) : c.code ? '<code style="background:#1E1F23;color:#E6E6E6;border-radius:5px;padding:2px 8px;white-space:pre">' + esc(c.code) + '</code>' : esc(c.text)) + (i === e.answer ? '　<b style="color:#1F5A32">← 正解</b>' : '') + '</li>').join('') + '</ol>' +
          '<p class="g" style="margin-top:6px">解説：' + esc(e.explain || '') + '</p>';
      } else {
        d.innerHTML = '<h3>演習' + (k + 1) + '　' + esc(e.title) + '</h3><ol class="g">' + e.goals.map((g) => '<li>' + esc(g) + '</li>').join('') + '</ol>' +
          '<div class="g" style="margin:8px 0 4px">最初のコード（' + esc(e.sprite) + '）</div>' + B.table(e.starter[e.sprite]) +
          (e.uses && e.uses.length ? '<div class="g" style="margin:10px 0 4px">左に出る「この課題で使うコード」</div><div style="display:flex;flex-wrap:wrap;gap:10px">' + e.uses.map((u) => '<div style="border:1px solid #EEF0F3;border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:3px">' + B.blocks(u.code) + '<code style="font-size:12px;background:#1E1F23;color:#E6E6E6;border-radius:4px;padding:2px 6px;white-space:pre">' + esc(u.code) + '</code><span class="g">' + esc(u.note) + '</span></div>').join('') + '</div>' : '');
      }
      box.appendChild(d);
    });
    window.scrollTo(0, 0);
    try { history.replaceState(null, '', '#' + l.id); } catch (err) { /* noop */ }
  }
  pick.addEventListener('change', () => show(Number(pick.value)));
  window.addEventListener('hashchange', () => { const i = lessons.findIndex((x) => '#' + x.l.id === location.hash); if (i >= 0 && String(i) !== pick.value) { pick.value = String(i); show(i); } });
  const fromHash = lessons.findIndex((x) => '#' + x.l.id === location.hash);
  pick.value = String(Math.max(0, fromHash));
  show(Math.max(0, fromHash));
})();
</script>
</body>
</html>
